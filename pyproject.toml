[project]
name = "pen-records"
version = "0.1.0"
description = "Fountain pen collection API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16.5", "fastapi>=0.116.1", "httpx>=0.28.1",
  "pillow>=11.3.0", "pillow-heif>=1.1.0", "psycopg[binary]>=3.2.9",
  "pydantic-settings>=2.10.1", "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.43", "typer>=0.16.1", "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-cov>=6.2.1", "ruff>=0.12.10"]

[project.scripts]
pen-records = "pen_records.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pen_records --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 120
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "BLE001", "E501"]
