server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ { expires 7d; add_header Cache-Control "public"; try_files $uri /index.html; }
}
